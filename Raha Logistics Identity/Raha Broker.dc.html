<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/industry-37dc6a56-aa49-4d0d-8002-ef72d326eda5/styles.css">
<script src="_ds/industry-37dc6a56-aa49-4d0d-8002-ef72d326eda5/_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-neutral-200)} a{color:var(--color-accent-700)} a:hover{color:var(--color-accent-900)}</style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:40px;font-family:var(--font-body);color:var(--color-text);width:max-content">
<header style="display:flex;align-items:end;gap:48px">
  <div><div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)">C — Responsive web</div><h1 style="font-size:48px;margin:0;line-height:1">Raha for Brokers &amp; Dispatchers</h1></div>
  <p style="margin:0;max-width:620px;font-size:15px;text-wrap:pretty">The broker's phone book, turned into a board. Cargo on the left, trucks with space on the right, the match in the middle. Brokers keep their relationships and their commission; Raha keeps the record.</p>
  <a href="Raha Index.dc.html" style="font-size:13px">Ecosystem index</a>
</header>
<div style="display:flex;gap:40px;flex-wrap:wrap;align-items:start">

<figure data-screen-label="B1 Match board" style="margin:0;display:flex;flex-direction:column;gap:12px">
<figcaption style="font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--color-text)">B1 · Match board · 1440</figcaption>
<div style="width:1440px;height:920px;background:var(--color-bg);border:1px solid var(--color-divider);display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:24px;padding:12px 20px;border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 24 24" width="20" height="20" fill="var(--color-text)"><rect x="0" y="0" width="8" height="24"></rect><rect x="10" y="0" width="14" height="11" fill="var(--color-accent)"></rect><path d="M10 13H16.5L24 24H17.5Z"></path></svg><span style="font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:0.12em">RAHA</span></div>
    <div style="display:flex;gap:4px;font-size:14px"><span style="padding:8px 12px;background:var(--color-accent-100);color:var(--color-accent-800);box-shadow:inset 0 -2px 0 var(--color-accent)">Match board</span><span style="padding:8px 12px">Active trips (9)</span><span style="padding:8px 12px">Requests</span><span style="padding:8px 12px">Trucks &amp; drivers</span><span style="padding:8px 12px">Commission</span></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px"><span class="text-muted">Kality Freight Brokerage</span><span style="padding:6px 10px;border:1px solid var(--color-divider)">Selamawit T. · Dispatcher ▾</span></div>
  </div>
  <div style="display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid var(--color-divider);align-items:center;font-size:13px"><span class="text-muted">Corridor</span><span class="tag tag-accent">Addis → South (Hawassa, Arba Minch)</span><span class="tag tag-neutral">Addis → East (Adama, Dire Dawa)</span><span class="tag tag-neutral">Djibouti corridor</span><span class="tag tag-outline">Today + tomorrow</span><span style="margin-left:auto" class="text-muted">Updated 09:58 · 14 requests · 11 trucks</span></div>
  <div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px minmax(0,1fr);min-height:0">
    <section style="border-right:1px solid var(--color-divider);display:flex;flex-direction:column;min-height:0">
      <div style="padding:14px 20px;display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-weight:600;font-size:20px">Cargo requests</span><span class="text-muted" style="font-size:12px">Sorted by pickup time</span></div>
      <sc-for list="{{ reqs }}" as="r" hint-placeholder-count="6">
        <div style="padding:12px 20px;border-top:1px solid var(--color-divider);display:grid;grid-template-columns:1fr auto;gap:4px;background:{{ r.bg }};box-shadow:{{ r.sh }}">
          <span style="font-family:var(--font-heading);font-weight:600;font-size:18px">{{ r.route }}</span><span style="font-family:var(--font-heading);font-weight:600;font-size:18px">{{ r.weight }}</span>
          <span class="text-muted" style="font-size:12px">{{ r.who }} · {{ r.cargo }}</span><span class="text-muted" style="font-size:12px">{{ r.when }}</span>
        </div>
      </sc-for>
    </section>
    <section style="display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--color-surface)">
      <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)">Proposed match · 94% route overlap</div>
      <div class="blueprint" style="padding:16px;background:var(--color-bg);display:flex;flex-direction:column;gap:6px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><span class="text-muted" style="font-size:12px">CARGO · RH-20931</span><span style="font-family:var(--font-heading);font-weight:600;font-size:22px">800 kg flour · Akaki → Hawassa</span><span style="font-size:13px">Sheba Agro PLC · ready 13:00</span></div>
      <div style="display:flex;align-items:center;gap:10px;justify-content:center"><span style="flex:1;height:1px;background:var(--color-accent)"></span><svg viewBox="0 0 24 24" width="28" height="28" fill="var(--color-accent)"><rect x="0" y="0" width="8" height="24" fill="var(--color-text)"></rect><rect x="10" y="0" width="14" height="11"></rect><path d="M10 13H16.5L24 24H17.5Z" fill="var(--color-text)"></path></svg><span style="flex:1;height:1px;background:var(--color-accent)"></span></div>
      <div class="blueprint" style="padding:16px;background:var(--color-bg);display:flex;flex-direction:column;gap:8px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><span class="text-muted" style="font-size:12px">TRUCK · 3-B 48213 AA</span><span style="font-family:var(--font-heading);font-weight:600;font-size:22px">Isuzu FSR · Abebe Kebede</span><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:16px"><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-text)"></span><span style="background:var(--color-accent)"></span><span style="border:1px solid var(--color-text)"></span></div><span style="font-size:13px">8 t on board · 2 t free · departs 14:00, 6 km detour</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--color-divider);background:var(--color-bg)">
        <div style="padding:12px;border-right:1px solid var(--color-divider)"><div class="text-muted" style="font-size:12px">Shipper pays</div><div style="font-family:var(--font-heading);font-weight:600;font-size:22px">ETB 4,200</div></div>
        <div style="padding:12px"><div class="text-muted" style="font-size:12px">Your commission</div><div style="font-family:var(--font-heading);font-weight:600;font-size:22px">ETB 420</div></div>
      </div>
      <div class="field"><label>Send offer to driver by</label><div class="seg"><label class="seg-opt"><input type="radio" name="ch" checked="">Raha app</label><label class="seg-opt"><input type="radio" name="ch">Telegram</label><label class="seg-opt"><input type="radio" name="ch">SMS</label><label class="seg-opt"><input type="radio" name="ch">I'll call</label></div></div>
      <div style="margin-top:auto;display:flex;gap:10px"><span class="btn btn-primary blueprint" style="flex:1;height:44px;font-size:16px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Send match to driver &amp; shipper</span><span class="btn btn-secondary" style="height:44px">Skip</span></div>
    </section>
    <section style="border-left:1px solid var(--color-divider);display:flex;flex-direction:column;min-height:0">
      <div style="padding:14px 20px;display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-weight:600;font-size:20px">Trucks with space</span><span class="text-muted" style="font-size:12px">Your network + Raha</span></div>
      <sc-for list="{{ trucks }}" as="t" hint-placeholder-count="6">
        <div style="padding:12px 20px;border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:6px;background:{{ t.bg }};box-shadow:{{ t.sh }}">
          <div style="display:flex;justify-content:space-between"><span style="font-family:var(--font-heading);font-weight:600;font-size:18px">{{ t.route }}</span><span style="font-size:13px;color:var(--color-accent-700)">{{ t.free }} free</span></div>
          <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:8px"><sc-for list="{{ t.cells }}" as="c"><span style="background:{{ c }};border:1px solid var(--color-text)"></span></sc-for></div>
          <span class="text-muted" style="font-size:12px">{{ t.who }} · {{ t.when }}</span>
        </div>
      </sc-for>
    </section>
  </div>
</div></figure>

<figure data-screen-label="B2 Active trips" style="margin:0;display:flex;flex-direction:column;gap:12px">
<figcaption style="font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--color-text)">B2 · Active trips and driver coordination · 1280</figcaption>
<div style="width:1280px;background:var(--color-bg);border:1px solid var(--color-divider);display:flex;flex-direction:column">
  <div style="padding:20px 24px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--color-divider)"><div><h2 style="font-size:32px;margin:0">Active trips</h2><div class="text-muted" style="font-size:13px">9 running · 2 need attention</div></div><div class="seg"><label class="seg-opt"><input type="radio" name="f" checked="">All 9</label><label class="seg-opt"><input type="radio" name="f">Needs attention 2</label><label class="seg-opt"><input type="radio" name="f">Silent &gt; 3 h</label></div></div>
  <table class="table" style="font-size:14px">
    <thead><tr><th style="padding-left:24px">Trip</th><th>Route</th><th>Driver</th><th>Stage</th><th>Last update</th><th>Channel</th><th style="padding-right:24px"></th></tr></thead>
    <tbody><sc-for list="{{ trips }}" as="t" hint-placeholder-count="6"><tr><td style="padding-left:24px;font-family:var(--font-heading);font-weight:600">{{ t.id }}</td><td>{{ t.route }}</td><td>{{ t.driver }}</td><td><span class="tag {{ t.tag }}" style="background:{{ t.bg }};color:{{ t.c }}">{{ t.stage }}</span></td><td>{{ t.upd }}</td><td class="text-muted">{{ t.ch }}</td><td style="padding-right:24px;text-align:right"><span class="btn btn-ghost">{{ t.act }}</span></td></tr></sc-for></tbody>
  </table>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--color-divider)">
    <div style="padding:18px 24px;border-right:1px solid var(--color-divider)"><div class="text-muted" style="font-size:12px">Matched this week</div><div style="font-family:var(--font-heading);font-weight:600;font-size:30px">37 loads</div></div>
    <div style="padding:18px 24px;border-right:1px solid var(--color-divider)"><div class="text-muted" style="font-size:12px">Return loads placed</div><div style="font-family:var(--font-heading);font-weight:600;font-size:30px">14</div></div>
    <div style="padding:18px 24px"><div class="text-muted" style="font-size:12px">Commission recorded</div><div style="font-family:var(--font-heading);font-weight:600;font-size:30px">ETB 22,850</div></div>
  </div>
</div></figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const sel = (on) => ({ bg: on ? 'var(--color-accent-100)' : 'transparent', sh: on ? 'inset 3px 0 0 var(--color-accent)' : 'none' });
    const cells = (own, total = 10) => Array.from({ length: total }, (_, i) => i < own ? 'var(--color-text)' : 'transparent');
    const tag = (k) => ({ transit: { tag: '', bg: 'var(--color-accent)', c: 'var(--color-bg)' }, matched: { tag: 'tag-accent', bg: '', c: '' }, issue: { tag: '', bg: 'var(--color-text)', c: 'var(--color-bg)' }, open: { tag: 'tag-outline', bg: '', c: '' } })[k];
    return {
      reqs: [
        { route: 'Akaki → Hawassa', weight: '800 kg', who: 'Sheba Agro PLC', cargo: 'Flour', when: 'Today 13:00', ...sel(true) },
        { route: 'Merkato → Shashamane', weight: '1.6 t', who: 'Hailu & Sons Trading', cargo: 'Plastic goods', when: 'Today 15:00', ...sel(false) },
        { route: 'Addis → Arba Minch', weight: '4 t', who: 'Lucy Textiles PLC', cargo: 'Fabric rolls', when: 'Tomorrow 07:00', ...sel(false) },
        { route: 'Hawassa → Addis', weight: '7.5 t', who: 'Sidama Coffee Union', cargo: 'Coffee', when: 'Tomorrow 07:00', ...sel(false) },
        { route: 'Modjo → Ziway', weight: '600 kg', who: 'Rift Ceramics', cargo: 'Tiles', when: 'Tomorrow 10:00', ...sel(false) },
        { route: 'Addis → Hosaena', weight: '2.2 t', who: 'Abol Beverages', cargo: 'Bottled water', when: 'Mes 29', ...sel(false) },
        { route: 'Adama → Hawassa', weight: '900 kg', who: 'Kidist Pharmacy Dist.', cargo: 'Boxed goods', when: 'Mes 29', ...sel(false) }
      ],
      trucks: [
        { route: 'Kality → Hawassa', free: '2 t', who: 'Abebe K. · Isuzu FSR', when: 'Today 14:00', cells: cells(8), ...sel(true) },
        { route: 'Addis → Shashamane', free: '4 t', who: 'Mulugeta B. · FSR', when: 'Today 16:00', cells: cells(6), ...sel(false) },
        { route: 'Hawassa → Addis', free: '15 t', who: 'Yonas G. · Howo', when: 'Return · tmrw 06:00', cells: cells(0), ...sel(false) },
        { route: 'Addis → Arba Minch', free: '5 t', who: 'Tana Logistics · Actros', when: 'Tomorrow 05:30', cells: cells(5), ...sel(false) },
        { route: 'Modjo → Hawassa', free: '3 t', who: 'Bekele T. · Canter', when: 'Tomorrow 08:00', cells: cells(1), ...sel(false) },
        { route: 'Adama → Hawassa', free: '1 t', who: 'Abay Transport · FSR', when: 'Mes 29 06:00', cells: cells(9), ...sel(false) }
      ],
      trips: [
        { id: 'RH-20931', route: 'Addis → Hawassa', driver: 'Abebe Kebede', stage: 'In transit', ...tag('transit'), upd: 'Ziway · 11:52', ch: 'App', act: 'Message' },
        { id: 'RH-20918', route: 'Adama → Dire Dawa', driver: 'Mulugeta Bekele', stage: '⚑ No update 4 h', ...tag('issue'), upd: 'Awash · 07:40', ch: 'SMS only', act: 'Call driver' },
        { id: 'RH-20922', route: 'Addis → Arba Minch', driver: 'Tesfaye Wolde', stage: 'At pickup', ...tag('matched'), upd: 'Kality · 10:02', ch: 'Telegram', act: 'Message' },
        { id: 'RH-20909', route: 'Hawassa → Addis', driver: 'Yonas Girma', stage: 'In transit', ...tag('transit'), upd: 'Shashamane · 09:30', ch: 'App', act: 'Message' },
        { id: 'RH-20899', route: 'Modjo → Djibouti', driver: 'Dereje Assefa', stage: '⚑ Customs hold', ...tag('issue'), upd: 'Galafi · 08:15', ch: 'Telegram', act: 'Open issue' },
        { id: 'RH-20935', route: 'Addis → Hosaena', driver: 'Unassigned', stage: 'Awaiting driver', ...tag('open'), upd: '—', ch: '—', act: 'Assign' }
      ]
    };
  }
}
</script>
</body>
</html>
